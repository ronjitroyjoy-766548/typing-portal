<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - টাইপিং টেস্ট পোর্টাল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-keyboard brand-icon"></i>
                <h2>টাইপিং টেস্ট পোর্টাল</h2>
                <p>পরীক্ষার্থীর লগইন প্যানেল</p>
            </div>

            <div id="login-error" class="error-alert" style="display: none;">
                ⚠️ ইউজার আইডি বা পাসওয়ার্ড ভুল!
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">ইউজার আইডি / রোল নম্বর</label>
                    <input type="text" id="username" placeholder="User ID বা Roll দিন" required>
                </div>
                <div class="form-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <input type="password" id="password" placeholder="Password দিন" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">লগইন করুন</button>
            </form>

            <div class="auth-links">
                <a onclick="openModal('forgotModal')">পাসওয়ার্ড ভুলে গেছেন?</a>
                <a onclick="openModal('registerModal')">নতুন একাউন্ট খুলুন</a>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal-overlay">
        <div class="modal-card">
            <h3>নতুন একাউন্ট নিবন্ধন</h3>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>পূর্ণ নাম</label>
                    <input type="text" id="reg-fullname" placeholder="আপনার পুরো নাম" required>
                </div>
                <div class="form-group">
                    <label>আবেদনকৃত পদ</label>
                    <select id="reg-post">
                        <option value="কম্পিউটার অপারেটর">কম্পিউটার অপারেটর</option>
                        <option value="সাঁটমুদ্রাক্ষরিক">সাঁটমুদ্রাক্ষরিক</option>
                        <option value="অফিস সহকারী">অফিস সহকারী</option>
                        <option value="ডাটা এন্ট্রি অপারেটর">ডাটা এন্ট্রি অপারেটর</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>জেলা</label>
                    <input type="text" id="reg-district" placeholder="আপনার জেলা" required>
                </div>
                <div class="form-group">
                    <label>মোবাইল নম্বর</label>
                    <input type="text" id="reg-mobile" placeholder="017xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>ইউজার আইডি (ইউনিক)</label>
                    <input type="text" id="reg-username" placeholder="যেমন: karim123" required>
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="reg-password" placeholder="পাসওয়ার্ড দিন" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">নিবন্ধন সম্পন্ন করুন</button>
                <button type="button" class="btn btn-secondary full-width" style="margin-top:8px;" onclick="closeModal('registerModal')">বাতিল</button>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal-overlay">
        <div class="modal-card">
            <h3>পাসওয়ার্ড পুনরুদ্ধার</h3>
            <div class="form-group">
                <label>আপনার ইউজার আইডি</label>
                <input type="text" id="forgot-username" placeholder="User ID লিখুন">
            </div>
            <button type="button" class="btn btn-primary full-width" onclick="showResetFields()">আইডি খুঁজুন</button>
            
            <div id="reset-section" style="display:none; margin-top:15px;">
                <div class="form-group">
                    <label>নতুন পাসওয়ার্ড</label>
                    <input type="password" id="new-password" placeholder="নতুন পাসওয়ার্ড লিখুন">
                </div>
                <button type="button" class="btn btn-primary full-width" onclick="saveNewPassword()">পাসওয়ার্ড পরিবর্তন করুন</button>
            </div>
            <button type="button" class="btn btn-secondary full-width" style="margin-top:8px;" onclick="closeModal('forgotModal')">বন্ধ করুন</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
