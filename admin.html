<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন ড্যাশবোর্ড - টাইপিং পোর্টাল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body onload="initAdminDashboard()">

    <nav class="navbar">
        <div class="nav-brand"><i class="fa-solid fa-user-shield"></i> এডমিন কন্ট্রোল প্যানেল</div>
        <button onclick="logoutUser()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
    </nav>

    <div class="container main-content">
        <div class="admin-grid">
            <!-- Create Exam Card -->
            <div class="admin-card">
                <h3><i class="fa-solid fa-plus-circle"></i> নতুন পরীক্ষা তৈরি করুন</h3>
                <form onsubmit="handleCreateExam(event)" style="margin-top:15px;">
                    <div class="form-group">
                        <label>পরীক্ষার শিরোনাম</label>
                        <input type="text" id="examTitle" placeholder="যেমন: কম্পিউটার অপারেটর টেস্ট" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>সময় (মিনিট)</label>
                            <input type="number" id="examDuration" value="5" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>ভাষা</label>
                            <select id="examLang">
                                <option value="Bangla">বাংলা</option>
                                <option value="English">ইংরেজি</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>পাস WPM</label>
                            <input type="number" id="passWpm" value="20" required>
                        </div>
                        <div class="form-group">
                            <label>পাস Accuracy (%)</label>
                            <input type="number" id="passAccuracy" value="80" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>ব্যাকস্পেস ব্যবহারের অনুমতি?</label>
                        <select id="allowBackspace">
                            <option value="yes">হ্যাঁ (Allowed)</option>
                            <option value="no">না (Restricted)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>পরীক্ষার অনুচ্ছেদ (Passage)</label>
                        <textarea id="examPassage" rows="5" placeholder="পরীক্ষার মূল অনুচ্ছেদ এখানে লিখুন..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary full-width">পরীক্ষা প্রকাশ করুন</button>
                </form>
            </div>

            <!-- Active Exams Card -->
            <div class="admin-card">
                <h3><i class="fa-solid fa-list-check"></i> তৈরি করা সকল পরীক্ষা</h3>
                <div id="adminExamListDisplay" style="margin-top:15px;"></div>
            </div>
        </div>

        <!-- Leaderboard / Merit List -->
        <div class="admin-card" style="margin-top:25px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3><i class="fa-solid fa-trophy"></i> সকল পরীক্ষার্থীর মেধা তালিকা (Merit List)</h3>
                <button onclick="clearAllResults()" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i> রেজাল্ট ক্লিয়ার</button>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>পরীক্ষার্থী</th>
                            <th>আইডি</th>
                            <th>জেলা</th>
                            <th>পরীক্ষা</th>
                            <th>স্পিড (WPM)</th>
                            <th>Acc (%)</th>
                            <th>ফলাফল</th>
                        </tr>
                    </thead>
                    <tbody id="meritTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
