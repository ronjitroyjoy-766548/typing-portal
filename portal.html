<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাইপিং পরীক্ষা - প্যানেল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body onload="initPortal()">

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-keyboard"></i> টাইপিং পরীক্ষা পোর্টাল
        </div>
        <div class="nav-menu">
            <a href="user-profile.html" class="nav-link"><i class="fa-solid fa-user"></i> প্রোফাইল</a>
            <button onclick="logoutUser()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
        </div>
    </nav>

    <div class="container main-content">
        <!-- Exam Selection View -->
        <div id="examSelectView">
            <h2 class="section-title">উপলব্ধ টাইপিং পরীক্ষাসমূহ</h2>
            <div id="availableExamsList" class="exam-grid"></div>
        </div>

        <!-- Exam Typing Area View -->
        <div id="examAreaView" style="display: none;">
            <div class="exam-top-bar">
                <div>
                    <h3 id="currentExamTitle">পরীক্ষার নাম</h3>
                    <p>পরীক্ষার্থী: <b id="exUserName">-</b> | রোল/আইডি: <b id="exUserId">-</b> | জেলা: <b id="exUserDistrict">-</b></p>
                </div>
                <div class="timer-box">
                    <span>অবশিষ্ট সময়:</span>
                    <h2 id="timerCountdown">00:00</h2>
                </div>
            </div>

            <!-- A4 Paper View -->
            <div class="a4-paper-container">
                <div class="a4-paper" id="a4Paper">
                    <div id="a4PassageBox" class="passage-display"></div>
                    <textarea id="typingInputField" class="typing-input" placeholder="এখানে টাইপিং শুরু করুন..." autocomplete="off" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="exam-actions">
                <button onclick="finishExamAndCalculate()" class="btn btn-success"><i class="fa-solid fa-paper-plane"></i> উত্তরপত্র জমা দিন</button>
            </div>
        </div>

        <!-- Result View -->
        <div id="resultAreaView" style="display: none;">
            <div class="result-card">
                <h2>🎉 পরীক্ষা সম্পন্ন হয়েছে!</h2>
                <hr style="margin: 15px 0; border:0; border-top:1px solid #e2e8f0;">
                <div id="resultDetailsBox"></div>
                <button onclick="window.location.reload()" class="btn btn-primary" style="margin-top:20px;">প্রধান পেজে ফিরে যান</button>
            </div>
        </div>
    </div>

    <!-- Verification Modal -->
    <div id="verifyModal" class="modal-overlay">
        <div class="modal-card">
            <h3>পরীক্ষার্থীর পরিচিতি যাচাই</h3>
            <p style="font-size:13px; color:#64748b; margin-bottom:15px;">পরীক্ষা শুরু করতে আপনার তথ্য নিশ্চিত করুন।</p>
            <div class="form-group">
                <label>ইউজার আইডি / রোল</label>
                <input type="text" id="verifyUserId" placeholder="আপনার আইডি">
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর</label>
                <input type="text" id="verifyMobile" placeholder="আপনার ফোন নম্বর">
            </div>
            <button onclick="verifyAndStartExam()" class="btn btn-primary full-width">যাচাই করুন ও পরীক্ষা শুরু করুন</button>
            <button onclick="closeVerifyModal()" class="btn btn-secondary full-width" style="margin-top:8px;">বাতিল</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/typing.js"></script>
</body>
</html>
